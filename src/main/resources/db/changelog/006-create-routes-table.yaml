databaseChangeLog:
  - changeSet:
      id: 6
      author: "el.amegoal@gmail.com"
      changes:
        - createTable:
            tableName: routes
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_routes
              - column:
                  name: route_name
                  type: VARCHAR(50)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: route_num
                  type: SMALLINT
                  constraints:
                    unique: true
                    nullable: false
                    check: "route_num >= 0 AND route_num <= 50"
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false