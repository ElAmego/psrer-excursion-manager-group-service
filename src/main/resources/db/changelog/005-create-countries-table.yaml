databaseChangeLog:
  - changeSet:
      id: 5
      author: "el.amegoal@gmail.com"
      changes:
        - createTable:
            tableName: countries
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_countries
              - column:
                  name: two_letter_country_code
                  type: VARCHAR(2)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: country_name
                  type: VARCHAR(50)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false