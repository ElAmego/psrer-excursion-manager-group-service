databaseChangeLog:
  - changeSet:
      id: 3
      author: "el.amegoal@gmail.com"
      changes:
        - createTable:
            tableName: accompanying_persons
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_accompanying_persons
              - column:
                  name: accompanying_person_name
                  type: VARCHAR(50)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: accompanying_person_phone_number
                  type: VARCHAR(9)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false